# Community engagement watcher — the alarm on the door for passive mode.
#
# Foxbook entered passive maintenance in September 2026: the maintainer is
# on other projects and is not reading this repo's notification stream
# day-to-day. History shows what that means unattended: issue #133 accrued
# 694 comments over 48 days before anyone looked. The failure mode passive
# mode must prevent is not "no notifications" — it is "a real human signal
# drowned in bot noise."
#
# This workflow runs daily and looks ONLY for signals a human caused:
#   - stars (count delta vs the last run; see "state cell" below)
#   - new forks
#   - new issues or PRs authored by someone who is not the maintainer or a bot
#   - new discussions, or new discussion comments, by someone who is not
#     the maintainer or a bot (this is how a reply from an integrator on
#     e.g. discussion #73 surfaces)
#   - ecosystem references: GitHub code outside this repo that mentions
#     "did:foxbook", "@foxbook/sdk-claim", or "transparency.foxbook.dev".
#     Copying and adoption look identical in code search, and both are
#     exactly what the maintainer wants to know about. New repos are
#     detected by diffing against a list in the state cell; the first run
#     baselines existing references (e.g. eriknewton/concordia-protocol)
#     silently. GitHub's code search excludes forks by default, so this
#     does not double-report what the fork collector already catches.
#
# When it finds any, it opens (or comments on) a single issue labeled
# `community-engagement`, assigned to the maintainer. Assignment is the
# point: GitHub ranks assigned-issue notifications above watch noise, so
# this is the one channel that stays loud when everything else is muted.
# Close the issue after responding; the next signal opens a fresh one.
#
# Stars need explanation. The obvious endpoint (list stargazers with the
# star+json media type, which carries starred_at) is refused for the
# workflow's installation token ("Resource not accessible by integration"),
# and unauthenticated calls from Actions runners get 401 (shared-IP
# policy) — both observed live on 2026-09-16, not assumed. So stars are
# detected as a COUNT DELTA against a state cell: a single CLOSED issue
# labeled `watch-state` whose body is a small JSON blob. Closed so it
# never clutters the live tracker; issue-body edits notify nobody. If the
# cell is missing (first run, or someone deleted it), the run re-baselines
# silently instead of alerting on history.
#
# Everything else is stateless with a 26h window over the 24h cron — the
# overlap means a signal can never fall between runs; the cost is a rare
# duplicate line, which is harmless.
#
# Collectors are isolated: one dead sensor cannot blank the others. A
# quiet run with a broken collector goes RED, not green — a silent run
# with dead sensors is indistinguishable from a healthy quiet run, which
# is the exact ambiguity that let the 2026 STH failure live 58 days.
#
# Bot-caused events (dependabot PRs, uptime/verification incidents, this
# workflow's own issues) are filtered out — they are exactly the noise
# this exists to rise above.
#
# Security: no run: blocks; no ${{ }} interpolation of third-party data;
# untrusted strings (issue titles) are embedded only as markdown text in
# an issue body.

name: community-watch

on:
  schedule:
    - cron: "37 6 * * *" # daily, 06:37 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Detect human engagement in the last 26h
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const OWNER = context.repo.owner;
            const REPO = context.repo.repo;
            const MAINTAINER = 'cloakmaster';
            const WINDOW_MS = 26 * 60 * 60 * 1000;
            const sinceMs = Date.now() - WINDOW_MS;
            const since = new Date(sinceMs).toISOString();
            const isBot = (login) => !login || login.endsWith('[bot]');
            const isSelf = (login) => login === MAINTAINER;
            const signals = [];
            const collectorErrors = [];

            const collect = async (name, fn) => {
              try {
                await fn();
              } catch (e) {
                collectorErrors.push(`${name}: ${e.message}`);
                core.warning(`collector "${name}" failed: ${e.message}`);
              }
            };

            // ---- state cell (closed issue labeled watch-state) ----
            let stateIssueNumber = null;
            let state = null;
            try {
              const rs = await github.rest.issues.listForRepo({
                owner: OWNER, repo: REPO, state: 'closed',
                labels: 'watch-state', per_page: 1,
              });
              if (rs.data.length > 0) {
                stateIssueNumber = rs.data[0].number;
                try { state = JSON.parse(rs.data[0].body ?? ''); } catch { state = null; }
              }
            } catch (e) {
              core.warning(`state cell read failed: ${e.message}`);
            }

            // --- stars: count delta vs state (see header for why) ---
            let starsNow = null;
            await collect('stars', async () => {
              const { data: repoInfo } = await github.rest.repos.get({ owner: OWNER, repo: REPO });
              starsNow = repoInfo.stargazers_count;
              if (state && typeof state.stars === 'number') {
                if (starsNow > state.stars) {
                  // Naming the stargazers is best-effort: the plain listing
                  // may also be refused for this token; the count delta is
                  // the signal either way.
                  let who = '';
                  try {
                    const list = await github.paginate(github.rest.activity.listStargazersForRepo, {
                      owner: OWNER, repo: REPO, per_page: 100,
                    });
                    const recent = list.slice(-(starsNow - state.stars)).map((u) => `@${u.login}`);
                    if (recent.length > 0) who = ` (${recent.join(', ')})`;
                  } catch { /* count-only alert */ }
                  signals.push(`⭐ Stars ${state.stars} → ${starsNow}${who} — https://github.com/${OWNER}/${REPO}/stargazers`);
                }
              } else {
                core.info(`no star baseline yet — baselining at ${starsNow} without alerting`);
              }
            });

            // --- forks ---
            await collect('forks', async () => {
              const forks = await github.paginate(github.rest.repos.listForks, {
                owner: OWNER, repo: REPO, per_page: 100,
              });
              for (const f of forks) {
                if (Date.parse(f.created_at) >= sinceMs) {
                  signals.push(`🍴 New fork: ${f.full_name} (${f.html_url})`);
                }
              }
            });

            // --- issues + PRs opened by humans ---
            await collect('issues', async () => {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: OWNER, repo: REPO, state: 'all', since, per_page: 100,
              });
              for (const i of issues) {
                const login = i.user?.login;
                if (isSelf(login) || isBot(login)) continue;
                if (Date.parse(i.created_at) >= sinceMs) {
                  const kind = i.pull_request ? 'PR' : 'Issue';
                  signals.push(`📥 New ${kind} #${i.number} by @${login}: "${i.title}" — ${i.html_url}`);
                }
              }
            });

            // --- discussions: new threads, and new comments by others ---
            await collect('discussions', async () => {
              const q = `query($owner:String!,$name:String!){
                repository(owner:$owner,name:$name){
                  discussions(first:15,orderBy:{field:UPDATED_AT,direction:DESC}){
                    nodes{
                      number title url createdAt author{login}
                      comments(last:10){nodes{createdAt url author{login}}}
                    }
                  }
                }
              }`;
              const d = await github.graphql(q, { owner: OWNER, name: REPO });
              for (const disc of d.repository.discussions.nodes) {
                const a = disc.author?.login;
                if (Date.parse(disc.createdAt) >= sinceMs && !isSelf(a) && !isBot(a)) {
                  signals.push(`💬 New discussion #${disc.number} by @${a}: "${disc.title}" — ${disc.url}`);
                }
                for (const c of disc.comments.nodes) {
                  const ca = c.author?.login;
                  if (Date.parse(c.createdAt) >= sinceMs && !isSelf(ca) && !isBot(ca)) {
                    signals.push(`💬 New comment on discussion #${disc.number} ("${disc.title}") by @${ca} — ${c.url}`);
                  }
                }
              }
            });

            // --- ecosystem: code outside this repo referencing foxbook ---
            // Copying and adoption are the same signal here. Needles are
            // distinctive strings that unrelated "foxbook" projects
            // (children's-book repos etc.) never contain.
            let ecosystemRepos = null;
            await collect('ecosystem', async () => {
              const needles = ['"did:foxbook"', '"@foxbook/sdk-claim"', '"transparency.foxbook.dev"'];
              const found = new Set();
              for (const needle of needles) {
                const res = await github.rest.search.code({
                  q: `${needle} -repo:${OWNER}/${REPO}`, per_page: 30,
                });
                for (const item of res.data.items) {
                  const full = item.repository?.full_name;
                  if (full && full !== `${OWNER}/${REPO}`) found.add(full);
                }
              }
              const known = new Set(Array.isArray(state?.ecosystemRepos) ? state.ecosystemRepos : []);
              const fresh = [...found].filter((r) => !known.has(r));
              if (Array.isArray(state?.ecosystemRepos)) {
                for (const r of fresh) {
                  signals.push(`🔭 foxbook protocol/SDK referenced in a new repo: ${r} — https://github.com/${r} (adoption or copy — either way, look)`);
                }
              } else {
                core.info(`ecosystem baseline: ${found.size} repo(s) already reference foxbook — recording without alerting: ${[...found].join(', ') || '(none)'}`);
              }
              // Union, capped, so the state cell can't grow without bound.
              ecosystemRepos = [...new Set([...known, ...found])].slice(0, 200);
            });

            // ---- persist state (create the cell closed if missing) ----
            if (starsNow !== null || ecosystemRepos !== null) {
              const stateBody = JSON.stringify({
                stars: starsNow ?? state?.stars ?? null,
                ecosystemRepos: ecosystemRepos ?? state?.ecosystemRepos ?? [],
                updated: new Date().toISOString(),
              });
              try {
                if (stateIssueNumber !== null) {
                  await github.rest.issues.update({
                    owner: OWNER, repo: REPO, issue_number: stateIssueNumber, body: stateBody,
                  });
                } else {
                  const created = await github.rest.issues.create({
                    owner: OWNER, repo: REPO,
                    title: 'watch-state (automation state cell — ignore)',
                    body: stateBody, labels: ['watch-state'],
                  });
                  await github.rest.issues.update({
                    owner: OWNER, repo: REPO, issue_number: created.data.number,
                    state: 'closed', state_reason: 'not_planned',
                  });
                  core.info(`created state cell issue #${created.data.number}`);
                }
              } catch (e) {
                collectorErrors.push(`state-write: ${e.message}`);
                core.warning(`state cell write failed: ${e.message}`);
              }
            }

            if (signals.length === 0) {
              if (collectorErrors.length > 0) {
                core.setFailed(`no signals, but ${collectorErrors.length} collector(s) broken: ${collectorErrors.join(' | ')}`);
              } else {
                core.info('No new human engagement in the last 26h.');
              }
              return;
            }

            const body = [
              `Human engagement detected in the last 26h:`,
              '',
              ...signals.map((s) => `- ${s}`),
              '',
              `_Reply promptly — an interested visitor who hears nothing concludes the project is dead, and this repo's pitch is that the log is alive._`,
              ...(collectorErrors.length > 0
                ? ['', `⚠️ Some collectors failed this run (coverage was partial): ${collectorErrors.join(' | ')}`]
                : []),
            ].join('\n');

            const open = await github.rest.issues.listForRepo({
              owner: OWNER, repo: REPO, state: 'open',
              labels: 'community-engagement', per_page: 10,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: OWNER, repo: REPO,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: OWNER, repo: REPO,
                title: '👋 Someone engaged with foxbook',
                body: body + '\n\nClose this after responding — the watcher opens a fresh one on the next signal.',
                labels: ['community-engagement'],
                assignees: [MAINTAINER],
              });
            }
